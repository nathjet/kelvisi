# Vérifie les services en ligne (Shom, IGN, EMODnet, Copernicus, Supabase). Lancement manuel uniquement.
name: Diagnostic

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Tests à lancer, séparés par des espaces (vide = tous)"
        required: false
        default: ""

permissions:
  contents: write   # publie les fichiers de diagnostic sur la branche « diagnostic »

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Noms voisins, pour repérer une faute de frappe dans le nom d'un secret (seule leur présence est affichée)
      CANDIDAT_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CANDIDAT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CANDIDAT_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      CANDIDAT_SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE }}
      CANDIDAT_SUPABASE_SERVICE_KEY_: ${{ secrets.SUPABASE_SERVICE_KEYS }}
      CANDIDAT_COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
      CANDIDAT_COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: |
          pip install requests numpy
          if [ -n "$COPERNICUSMARINE_SERVICE_USERNAME" ]; then pip install copernicusmarine; fi
      - name: Diagnostic
        if: ${{ !contains(github.event.inputs.tests, 'navigateur') }}
        env:
          TESTS: ${{ github.event.inputs.tests }}
        run: python outils/diagnostic.py $TESTS
      - name: Navigateur réel (captures et lectures dans la page)
        if: contains(github.event.inputs.tests, 'navigateur')
        env:
          TESTS: ${{ github.event.inputs.tests }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python outils/navigateur_diag.py $TESTS
      - name: Publier les fichiers de diagnostic
        run: |
          if [ -d diag ]; then
            cd diag
            git init -q -b diagnostic
            git -c user.name="diagnostic" -c user.email="diagnostic@users.noreply.github.com" add -A
            git -c user.name="diagnostic" -c user.email="diagnostic@users.noreply.github.com" commit -q -m "Diagnostic $GITHUB_RUN_ID"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostic
          fi
